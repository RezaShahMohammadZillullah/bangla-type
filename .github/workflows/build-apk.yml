name: Build Vartex Bangla Type APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_release_aab:
        description: 'Also build Release AAB for Google Play Console'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build Debug APK (Direct Phone Install)
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bangla-type-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release AAB (Store Publishing)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release_aab }}
        run: gradle bundleRelease --no-daemon

      - name: Upload Release AAB Artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release_aab }}
        uses: actions/upload-artifact@v7
        with:
          name: bangla-type-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
